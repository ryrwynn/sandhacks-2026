[project]
name = "rentwatch"
version = "0.1.0"
description = "RentWatch: San Diego rent and home-value analysis (FastAPI engine + worker)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "psycopg[binary,pool]>=3.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "joblib>=1.4",
  "google-genai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["."]
