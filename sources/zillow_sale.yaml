# Zillow for-sale listings via Bright Data (same dataset, separate daily job).
source_key: zillow_sale
kind: listing_site
listing_type: sale
trust_weight: 1.0
fetch:
  method: brightdata_dataset
  dataset_id: gd_lfqkr8wm13ixtbd8f5
  discover_by: url
  zip_file: data/zips.txt
  input_url: "https://www.zillow.com/{city}-ca-{zip}/"
  city_by_zip: {"91910": chula-vista}   # every other ZIP uses san-diego
  limit_per_input: 20
drop_fields:
  - listing_provided_by
  - management_company_phone_number
  - postingContact
  - brokerageName
  - attributionInfo
  - agentName
  - agentPhoneNumber
  - brokerPhoneNumber
  - contact_recipients
  - photos
  - nearbyHomes
  - schools
  - nearbyCities
  - nearbyNeighborhoods
  - nearbyZipcodes
  - zestimate_history
  - taxHistory
  - streetViewMetadataUrlMediaWallLatLong
  - streetViewMetadataUrlMediaWallAddress
  - publish_url
redact_fields: [description]
hash_ignore: [timestamp, days_on_zillow, daysOnZillow, overview, num_of_contacts, num_of_applications]
keep_if:
  homeStatus: [FOR_SALE]
zip_filter: data/zips.txt
map:
  external_id: zpid
  price_usd: price
  beds: bedrooms
  baths: bathrooms
  sqft: livingArea|sqft
  year_built: yearBuilt
  property_type: homeType
  address_norm: streetAddress
  unit_label: unit_number
  zip: zipcode
  lat: latitude
  lng: longitude
  text: description
property_types:
  APARTMENT: apartment
  CONDO: condo
  SINGLE_FAMILY: single_family
  TOWNHOUSE: townhouse
  MULTI_FAMILY: multi_family
  MANUFACTURED: manufactured
extras_map:
  home_status: homeStatus
  days_on_zillow: daysOnZillow|days_on_zillow
  lot_sqft: lotSize
  hoa_fee: monthlyHoaFee
  property_tax_rate: propertyTaxRate
  last_sold_price: lastSoldPrice
  walk_score: getting_around.walk.score
  transit_score: getting_around.transit.score
  tags: tags
history:
  path: priceHistory
  date: date
  price: price
  event: event
  keep_events: ["Listed for sale", "Price change"]
location_precision: address
llm_extract:
  from: text
  fields: [year_built]
  only_if_text_matches: '(?i)(built|constructed|completed|circa)\D{0,25}(19|20)\d\d'
